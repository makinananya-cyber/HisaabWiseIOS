<svg viewBox="0 0 300 216" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="pageG" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#FFF9F0"/>
            <stop offset="1" stop-color="#F7F2EB"/>
          </linearGradient>
          <linearGradient id="barG" x1="0" y1="1" x2="0" y2="0">
            <stop offset="0" stop-color="#334EAC"/>
            <stop offset="1" stop-color="#D0E3FF"/>
          </linearGradient>
          <linearGradient id="handG" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#7096D1"/>
            <stop offset="1" stop-color="#334EAC"/>
          </linearGradient>
          <radialGradient id="coinG" cx="34%" cy="28%" r="76%">
            <stop offset="0" stop-color="#FFF9F0"/>
            <stop offset="1" stop-color="#BAD6EB"/>
          </radialGradient>
          <radialGradient id="glowG" cx="50%" cy="50%" r="50%">
            <stop offset="0" stop-color="#7096D1" stop-opacity=".5"/>
            <stop offset="1" stop-color="#7096D1" stop-opacity="0"/>
          </radialGradient>
        </defs>

        <!-- soft aura + orbit rings -->
        <ellipse class="aura" cx="150" cy="118" rx="124" ry="72" fill="url(#glowG)" opacity=".55"/>
        <g stroke="#7096D1" fill="none" stroke-width="1">
          <g transform="rotate(-14 150 112)">
            <ellipse class="orbit-a" cx="150" cy="112" rx="138" ry="58" opacity=".24"/>
          </g>
          <g transform="rotate(20 150 112)">
            <ellipse class="orbit-b" cx="150" cy="112" rx="120" ry="76" opacity=".14"/>
          </g>
        </g>

        <!-- ═══ supporting hand ═══ -->
        <g class="hand">
          <path d="M34 164 C 40 194, 84 210, 150 210 C 216 210, 260 194, 266 164
                   L252 160 C 246 184, 208 196, 150 196 C 92 196, 54 184, 48 160 Z"
                fill="url(#handG)"/>
          <ellipse cx="42" cy="166" rx="11" ry="7" fill="#7096D1" transform="rotate(-34 42 166)"/>
          <g stroke="#081F5C" stroke-opacity=".22" stroke-width="1.4" stroke-linecap="round">
            <path d="M196 200 C 200 195, 202 190, 202 186"/>
            <path d="M222 194 C 227 189, 230 185, 231 181"/>
          </g>
        </g>

        <!-- ═══ open book ═══ -->
        <!-- fanned pages behind -->
        <g class="fan" stroke="#BAD6EB" fill="none" stroke-width="1.6" stroke-linecap="round" opacity=".5">
          <path d="M148 146 C 122 130, 90 120, 54 118"/>
          <path d="M146 139 C 122 124, 92 112, 60 110"/>
          <path d="M152 146 C 178 130, 210 120, 246 118"/>
          <path d="M154 139 C 178 124, 208 112, 240 110"/>
        </g>

        <!-- page thickness -->
        <path d="M44 136 C 84 138, 120 152, 150 170 L150 178 C 120 160, 84 145, 41 143 Z"
              fill="#BAD6EB" opacity=".55"/>
        <path d="M256 136 C 216 138, 180 152, 150 170 L150 178 C 180 160, 216 145, 259 143 Z"
              fill="#BAD6EB" opacity=".4"/>

        <!-- left page -->
        <path class="page-l"
              d="M150 152 C 122 136, 88 126, 50 124 L44 136 C 84 138, 120 152, 150 170 Z"
              fill="url(#pageG)"/>
        <!-- right page -->
        <path class="page-r"
              d="M150 152 C 178 136, 212 126, 250 124 L256 136 C 216 138, 180 152, 150 170 Z"
              fill="url(#pageG)"/>

        <!-- ═══ growth rising off the page ═══ -->
        <rect class="bar bar-1" x="72"  y="96" width="14" height="34" rx="4" fill="url(#barG)"/>
        <rect class="bar bar-2" x="92"  y="83" width="14" height="52" rx="4" fill="url(#barG)"/>
        <rect class="bar bar-3" x="112" y="69" width="14" height="72" rx="4" fill="url(#barG)"/>

        <path class="trend" d="M64 112 C 88 100, 100 78, 122 64 C 138 54, 152 46, 166 42"
              fill="none" stroke="#D0E3FF" stroke-width="2.8"
              stroke-linecap="round" stroke-linejoin="round"/>
        <path class="trend-head" d="M156 36 L167 41 L162 52"
              fill="none" stroke="#D0E3FF" stroke-width="2.8"
              stroke-linecap="round" stroke-linejoin="round"/>

        <!-- ═══ coin above the other page ═══ -->
        <g class="coin-pop">
          <g class="coin-flip">
            <circle cx="206" cy="84" r="22" fill="url(#coinG)"/>
            <circle cx="206" cy="84" r="15.5" fill="none"
                    stroke="#334EAC" stroke-opacity=".28" stroke-width="1.6"/>
            <g stroke="#334EAC" stroke-opacity=".75" stroke-width="2.2"
               stroke-linecap="round" fill="none">
              <circle cx="206" cy="84" r="6.2"/>
              <path d="M201.6 79.6 L198.4 76.4"/>
              <path d="M210.4 79.6 L213.6 76.4"/>
              <path d="M201.6 88.4 L198.4 91.6"/>
              <path d="M210.4 88.4 L213.6 91.6"/>
            </g>
          </g>
        </g>

        <!-- ═══ floating bits ═══ -->
        <circle class="drift"          cx="252" cy="58"  r="8" fill="url(#coinG)"/>
        <circle class="drift drift-2"  cx="50"  cy="60"  r="6" fill="url(#coinG)" opacity=".85"/>
        <circle class="drift drift-3"  cx="270" cy="126" r="5" fill="url(#coinG)" opacity=".7"/>

        <path class="twinkle" fill="#FFF9F0"
              d="M240 99 Q240 106 247 106 Q240 106 240 113 Q240 106 233 106 Q240 106 240 99 Z"/>
        <path class="twinkle twinkle-2" fill="#D0E3FF"
              d="M74 48.5 Q74 54 79.5 54 Q74 54 74 59.5 Q74 54 68.5 54 Q74 54 74 48.5 Z"/>
      </svg>
